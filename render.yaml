        value: production
      - key: JWT_SECRET
        sync: false
      - key: ZEROG_NETWORK
        value: mainnet
      - key: ZEROG_EVM_RPC
        value: https://evmrpc.0g.ai
      - key: ZEROG_INFT_CONTRACT_ADDRESS
        value: 0x67493Bb91e904840d39397E350f4A7865B779E10
      - key: ZEROG_STORAGE_PRIVATE_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false

  # ── Inference Service (AI battle commentary via 0G Compute) ──────────────────
  - type: web
    name: aiarena-inference
    env: node
    plan: starter
    region: oregon
    rootDir: services/inference-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/inference-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8013"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ZEROG_COMPUTE_BASE_URL
        value: https://router-api.0g.ai/v1
      - key: ZEROG_COMPUTE_API_KEY
        sync: false
      - key: ZEROG_MODEL_CHAT
        value: zai-org/GLM-5.1-FP8
      - key: ZEROG_NETWORK
        value: mainnet
      - key: INTERNAL_SERVICE_SECRET
        sync: false

  # ── Memory Service (agent episode storage on 0G Storage) ─────────────────────
  - type: web
    name: aiarena-memory
