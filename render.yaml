# AI Arena — Render Blueprint
# Render Dashboard → New → Blueprint → connect repo → fill in secret values in the wizard
#
# After deploy: run DB migration once via Shell on aiarena-agent:
#   npx prisma migrate deploy

databases:
  - name: aiarena-db
    databaseName: aiarena
    user: aiarena_user
    plan: free
    region: oregon

services:
  # ── NATS (private — internal messaging bus) ───────────────────────────────────
  - type: pserv
    name: aiarena-nats
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/nats/Dockerfile
    dockerContext: ./services/nats
    envVars:
      - key: NATS_USER
        value: arena
      - key: NATS_PASSWORD
        sync: false

  # ── Redis ─────────────────────────────────────────────────────────────────────
  - type: redis
    name: aiarena-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── Identity Service ──────────────────────────────────────────────────────────
  - type: web
    name: aiarena-identity
    env: node
    plan: starter
    region: oregon
    rootDir: services/identity-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/identity-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aiarena-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: CUSTODIAL_WALLET_ENCRYPTION_KEY
        sync: false
      - key: NATS_URL
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: BOT_REGISTRATION_SECRET
        sync: false

  # ── Agent Service ─────────────────────────────────────────────────────────────
  - type: web
    name: aiarena-agent
    env: node
    plan: starter
    region: oregon
    rootDir: services/agent-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/agent-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8002"
      - key: NODE_ENV
        value: production
      - key: ENABLE_AVATAR_GEN
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NATS_URL
        sync: false
      - key: ZEROG_COMPUTE_BASE_URL
        value: https://router-api.0g.ai/v1
      - key: ZEROG_COMPUTE_API_KEY
        sync: false
      - key: ZEROG_MODEL_CHAT
        value: zai-org/GLM-5.1-FP8
      - key: ZEROG_MODEL_IMAGE
        value: z-image
      - key: ZEROG_NETWORK
        value: mainnet
      - key: ZEROG_STORAGE_PRIVATE_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: FINANCIAL_SERVICE_URL
        value: https://aiarena-financial.onrender.com
      - key: INFT_SERVICE_URL
        value: https://aiarena-inft.onrender.com
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      # OKX Agent Marketplace A2MCP bridge — checked by okxServiceMiddleware,
      # issued/rotated independently of INTERNAL_SERVICE_SECRET. See docs/okx/.
      - key: OKX_SERVICE_KEY
        sync: false

  # ── OKX Payment Proxy (x402 v2 gate in front of /okx/create-agent) ────────────
  # Pure ESM, no Prisma/db-client dependency — standalone build.
  # Protocol: x402 v2, eip155:196 (X Layer), EIP-3009 transferWithAuthorization.
  - type: web
    name: aiarena-okx-payment-proxy
    env: node
    plan: starter
    region: oregon
    rootDir: services/okx-payment-proxy
    buildCommand: cd ../.. && pnpm install --ignore-scripts && node_modules/.bin/turbo run build --filter=@ai-arena/okx-payment-proxy
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8090"
      - key: NODE_ENV
        value: production
      - key: OKX_PROXY_UPSTREAM_URL
        value: https://aiarena-agent.onrender.com/okx/create-agent
      # Must match aiarena-agent's OKX_SERVICE_KEY above exactly.
      - key: OKX_SERVICE_KEY
        sync: false
      # x402 v2 payment terms — defaults match OKX's specification for ASP #2170.
      # OKX's facilitator executes transferWithAuthorization on-chain (gasless for us).
      # Override here if OKX changes payTo or the USDT contract address.
      - key: X402_ASSET
        value: "0x779ded0c9e1022225f8e0630b35a9b54be713736"
      - key: X402_PAY_TO
        value: "0xaa1860e22184852ae8b1890169b732da23459990"
      - key: X402_AMOUNT
        value: "100000"
      # OKX Developer Portal credentials — used to submit task deliverables after
      # a successful create-agent call (OKX review issue #4, save deliverable).
      # Set in Render dashboard; rotate when compromised.
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET_KEY
        sync: false
      - key: OKX_API_PASSPHRASE
        sync: false
      # Our ASP agent ID on OKX marketplace (ASP #2170).
      - key: OKX_PROVIDER_AGENT_ID
        value: "2170"

  # ── Battle Service ────────────────────────────────────────────────────────────
  - type: web
    name: aiarena-battle
    env: node
    plan: starter
    region: oregon
    rootDir: services/battle-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/battle-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8003"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NATS_URL
        sync: false
      - key: ZEROG_COMPUTE_BASE_URL
        value: https://router-api.0g.ai/v1
      - key: ZEROG_COMPUTE_API_KEY
        sync: false
      - key: ZEROG_STORAGE_PRIVATE_KEY
        sync: false
      - key: ZEROG_NETWORK
        value: mainnet
      - key: FINANCIAL_SERVICE_URL
        value: https://aiarena-financial.onrender.com

  # ── Matchmaking Service ───────────────────────────────────────────────────────
  - type: web
    name: aiarena-matchmaking
    env: node
    plan: starter
    region: oregon
    rootDir: services/matchmaking-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/matchmaking-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8004"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aiarena-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NATS_URL
        sync: false
      - key: FINANCIAL_SERVICE_URL
        value: https://aiarena-financial.onrender.com
      - key: BATTLE_SERVICE_URL
        value: https://aiarena-battle.onrender.com
      - key: AGENT_SERVICE_URL
        value: https://aiarena-agent.onrender.com
      - key: MEMORY_SERVICE_URL
        value: https://aiarena-memory.onrender.com
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: WAGER_STAKE_AMOUNT
        value: "5"

  # ── Financial Service ─────────────────────────────────────────────────────────
  - type: web
    name: aiarena-financial
    env: node
    plan: starter
    region: oregon
    rootDir: services/financial-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/financial-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8005"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NATS_URL
        sync: false
      - key: ZEROG_RPC_URL
        value: https://evmrpc.0g.ai
      - key: ARENA_TOKEN_ADDRESS
        sync: false
      - key: ARENA_TREASURY_ADDRESS
        sync: false
      - key: ARENA_REWARD_DISTRIBUTOR_ADDRESS
        sync: false
      - key: ARENA_ESCROW_ADDRESS
        sync: false
      - key: ARENA_TOURNAMENT_ADDRESS
        sync: false
      - key: ARENA_RELAYER_PRIVATE_KEY
        sync: false
      - key: ARENA_CHAIN_SERVICE_URL
        value: https://aiarena-arena-chain.onrender.com
      - key: INTERNAL_SERVICE_SECRET
        sync: false

  # ── $ARENA Chain Service (0G Chain relayer/indexer — replaces Solana token-service) ──
  - type: web
    name: aiarena-arena-chain
    env: node
    plan: starter
    region: oregon
    rootDir: services/arena-chain-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/arena-chain-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8050"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: NATS_URL
        sync: false
      - key: ZEROG_RPC_URL
        value: https://evmrpc.0g.ai
      - key: ARENA_TOKEN_ADDRESS
        sync: false
      - key: ARENA_TREASURY_ADDRESS
        sync: false
      - key: ARENA_REWARD_DISTRIBUTOR_ADDRESS
        sync: false
      - key: ARENA_ESCROW_ADDRESS
        sync: false
      - key: ARENA_TOURNAMENT_ADDRESS
        sync: false
      - key: ARENA_RELAYER_PRIVATE_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false

  # ── Training Worker (real trait training) ────────────────────────────────────
  # Executes the ml/trait_training pipeline: the trainer donates demonstrations
  # from its own policy, the student learns by behaviour cloning, PPO refines it
  # on the trainer's curriculum, and a seeded evaluation measures the result.
  #
  # A worker (not a web service): it has no HTTP surface and claims jobs from
  # Postgres with FOR UPDATE SKIP LOCKED, so several replicas are safe and NATS
  # delivery is never on the correctness path.
  #
  # CPU only. The environment is 32 features over 7 actions — no GPU plan needed.
  # Scale to >1 replica for concurrent marketplace jobs; each claims a distinct
  # row.
  - type: worker
    name: aiarena-training-worker
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./workers/training-worker/Dockerfile
    # Repo root: the worker imports ml/trait_training, which imports
    # ml/reinforcement_learning and ml/behaviour_cloning.
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: TRAINING_POLL_INTERVAL_S
        value: "5"
      # A RUNNING job whose heartbeat is older than this is treated as
      # abandoned and requeued.
      - key: TRAINING_STALE_AFTER_S
        value: "300"
      - key: TRAINING_CHECKPOINT_DIR
        value: /tmp

  # ── Evaluation Service (the verifier) ────────────────────────────────────────
  # Holds VERIFIER_ROLE and nothing else. Its key MUST differ from the base
  # chain relayer key — one drives job state, the other judges outcomes (T3).
  - type: web
    name: aiarena-evaluation
    env: node
    plan: starter
    region: oregon
    rootDir: services/evaluation-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/evaluation-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8081"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: A2A_JOB_ESCROW_ADDRESS
        sync: false
      - key: A2A_VERIFIER_PRIVATE_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: ZEROG_NETWORK
        value: mainnet
      - key: ZEROG_STORAGE_PRIVATE_KEY
        sync: false

  # ── A2A Marketplace Service (job meaning) ────────────────────────────────────
  # Owns prompts, requirement parsing and negotiation. Holds NO chain key —
  # every on-chain action is delegated to aiarena-base-chain.
  - type: web
    name: aiarena-a2a-marketplace
    env: node
    plan: starter
    region: oregon
    rootDir: services/a2a-marketplace-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/a2a-marketplace-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: BASE_CHAIN_SERVICE_URL
        value: https://aiarena-base-chain.onrender.com
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      # EIP-712 signatures are bound to one escrow on one chain. Without
      # these the service refuses to sign rather than guessing a domain, so
      # negotiation fails closed instead of producing junk signatures.
      - key: A2A_JOB_ESCROW_ADDRESS
        sync: false
      - key: BASE_CHAIN_ID
        value: "8453"
      # Advances EXECUTING jobs once training finishes. Without the tick a
      # job sits until the escrow times out.
      - key: EXECUTION_POLL_INTERVAL_MS
        value: "30000"
      # 0G Compute assists requirement extraction; a deterministic parser is
      # always run alongside it, so an outage degrades quality, not uptime.
      - key: ZEROG_NETWORK
        value: mainnet
      - key: ZEROG_COMPUTE_API_KEY
        sync: false
      - key: ZEROG_STORAGE_PRIVATE_KEY
        sync: false

  # ── Base Chain Service (A2A agent commerce on Base mainnet) ──────────────────
  # Sole relayer/signer for Base. Holds BASE_RELAYER_PRIVATE_KEY and the agent
  # signing-key encryption secret. See docs/architecture/A2A_MARKETPLACE_BASE.md.
  #
  # A2A_PUBLIC_BASE_URL must be this service's own public origin: it becomes the
  # ERC-8004 tokenURI, which foreign agents resolve without any credentials. If
  # it is wrong, registered agent identities point at a dead URL and fixing it
  # costs an on-chain setAgentURI per agent.
  - type: web
    name: aiarena-base-chain
    env: node
    plan: starter
    region: oregon
    rootDir: services/base-chain-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/base-chain-service...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8051"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      # Gas-payer for every Base transaction. Must NOT reuse the 0G deployer key
      # (that one is in this repo's public git history).
      - key: BASE_RELAYER_PRIVATE_KEY
        sync: false
      # Rotating this without re-encrypting existing rows permanently orphans
      # every stored agent signing key.
      - key: AGENT_WALLET_ENCRYPTION_KEY
        sync: false
      - key: A2A_PUBLIC_BASE_URL
        value: https://aiarena-base-chain.onrender.com
      - key: ERC8004_REPUTATION_REGISTRY_ADDRESS
        value: "0x8004BAa17C55a88189AE136b182e5fdA19dE9b63"
      # ERC-8021 attribution. Claim at base.dev; empty means unattributed.
      - key: BASE_BUILDER_CODE
        sync: false
      - key: A2A_JOB_ESCROW_ADDRESS
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      # 0G Storage — publishes the agent registration file whose Merkle root is
      # committed alongside the on-chain registration. Indexer/RPC endpoints
      # come from getZeroGConfig()'s per-network defaults, not env, so only the
      # signing key and network selector are set here.
      - key: ZEROG_NETWORK
        value: mainnet
      - key: ZEROG_STORAGE_PRIVATE_KEY
        sync: false

  # ── Leaderboard Service ───────────────────────────────────────────────────────
  - type: web
    name: aiarena-leaderboard
    env: node
    plan: starter
    region: oregon
    rootDir: services/leaderboard-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/leaderboard-service...
    startCommand: node dist/main.js
