      - key: DATABASE_URL
        fromDatabase:
          name: aiarena-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NATS_URL
        sync: false

  # ── API Gateway (public entry point) ─────────────────────────────────────────
  - type: web
    name: aiarena-gateway
    env: node
    plan: starter
    region: oregon
    rootDir: services/api-gateway
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/api-gateway...
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          name: aiarena-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://kult-browser-rust-l2lwg.ondigitalocean.app,https://warzonewarriors.xyz,https://www.warzonewarriors.xyz,https://pub-2c48e58780b648b7a2a77316f7b0aa2c.r2.dev,http://localhost:3000,http://localhost:5173,http://localhost:8080"
      - key: IDENTITY_SERVICE_URL
        value: https://aiarena-identity.onrender.com
      - key: AGENT_SERVICE_URL
        value: https://aiarena-agent.onrender.com
      - key: BATTLE_SERVICE_URL
        value: https://aiarena-battle.onrender.com
      - key: MATCHMAKING_SERVICE_URL
        value: https://aiarena-matchmaking.onrender.com
      - key: FINANCIAL_SERVICE_URL
        value: https://aiarena-financial.onrender.com
      - key: ARENA_CHAIN_SERVICE_URL
        value: https://aiarena-arena-chain.onrender.com
      - key: LEADERBOARD_SERVICE_URL
        value: https://aiarena-leaderboard.onrender.com
      - key: INFT_SERVICE_URL
        value: https://aiarena-inft.onrender.com
      - key: INFERENCE_SERVICE_URL
        value: https://aiarena-inference.onrender.com
      - key: MEMORY_SERVICE_URL
        value: https://aiarena-memory.onrender.com
      - key: LEAGUE_SERVICE_URL
        value: https://aiarena-league.onrender.com
      - key: OKX_PAYMENT_PROXY_URL
        value: https://aiarena-okx-payment-proxy.onrender.com
      # A2A agent commerce on Base. Serves the public ERC-8004 tokenURI via
      # /v1/a2a/identity/agents/:id/registration.json — must stay unauthenticated.
      - key: BASE_CHAIN_SERVICE_URL
        value: https://aiarena-base-chain.onrender.com
      # Without this, /v1/marketplace/* falls back to http://localhost:8080 and
      # 500s in production — the gateway routing table has a localhost default.
      - key: A2A_MARKETPLACE_SERVICE_URL
        value: https://aiarena-a2a-marketplace.onrender.com

  # ── INFT Service (ERC-7857 Living NFT on 0G Chain) ───────────────────────────
  - type: web
    name: aiarena-inft
    env: node
    plan: starter
    region: oregon
    rootDir: services/inft-service
    buildCommand: cd ../.. && pnpm install --ignore-scripts && packages/db-client/node_modules/.bin/prisma generate --schema=packages/db-client/prisma/schema.prisma && node_modules/.bin/turbo run build --filter=@ai-arena/inft-service...
